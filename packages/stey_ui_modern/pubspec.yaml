name: stey_ui_modern
description: Native Flutter components based on Cloudflare Kumo, with explicit parity tracking.
version: 0.1.0-dev.1
publish_to: none
repository: https://github.com/stey-jp/stey-ui
resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  re_highlight: 0.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  fonts:
    - family: SteyCodeMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
